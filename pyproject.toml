[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secmaster"
version = "1.0.0"
description = "Point-in-time security master: link changing vendor ids and tickers to permanent entities, scored against synthetic ground truth."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
secmaster = "secmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
